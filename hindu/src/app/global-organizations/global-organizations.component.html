        </div>
          <div class="col-md-6 col-lg-7 col-xl-8 mt-3 hide-scrollbar" style="overflow-y: scroll; height: 65vh;">
            <section>
              <div>
                <div class="card mt-3">
                  <div class="row no-gutters">
                    <div class="col-md-4 text-center">
                      <img
                        [src]="(orginazationsCategorydata && orginazationsCategorydata.image)
                               ? orginazationsCategorydata.image
                               : '../../assets/images/noImageDataImage.jpg'"

                        class="responsive-img p-2">
                    </div>
                    <div class="col-md-8 d-flex flex-column justify-content-center p-3">
                      <h4 class="card-title mb-2" style="font-size: 24px; color: #ff4500;">
                        <b>{{ orginazationsCategorydata?.name || 'Organizations' }}</b>
                      </h4>
                      <p class="card-text" style="font-size: 18px;">{{ orginazationsCategorydata?.desc }}</p>
                    </div>
                  </div>
                </div>


                <div class="container card mt-3">
                  <div class="slider-div">
                    <ng-container *ngIf="Categories && Categories.length > 0; else noData">
                      <div class="row mt-3 g-1">
                        <div *ngFor="let organization of Categories" class="col-6 col-sm-6 col-md-6 col-lg-4 col-xl-3 mb-4">
                          <div class="image-container text-center">
                            <a (click)="navigateorganizationDetail(organization._id)">
                              <img
                                [src]="organization.image && !organization.image.includes('data not found')
                                       ?  organization.image
                                       : '../../assets/images/noImageDataImage.jpg'"
                                style="height: 25vh; width: 100%; max-width: 250px; border-radius: 10px;"
                                class="img-fluid img-thumbnail"
                                alt="image" (error)="handleImageError($event)">
                            </a>
                            <p class="my-2 text-truncate" style="font-size: 14px;">{{ organization.name }}</p>
                          </div>
                        </div>
                        <div *ngIf="isLoadingNextPage">
                          <p>Loading more organizations...</p>
                        </div>
                      </div>
                    </ng-container>
                  </div>
                </div>
              </div>

              <ng-template #noData>
                <div class="row text-center">
                  <div class="col">
                    <img src="../../assets/images/not _found.jpg" alt="No Data" class="img-fluid" style="width: 30%;" />
                  </div>
                </div>
                <div class="row text-center">
                  <div class="col">
                    <p>No Data Found</p>
                  </div>
                </div>
              </ng-template>
            </section>
          </div>

          <div class="col-md-3 col-lg-2 mt-5 d-none d-md-block">
            <div class="image-container"  style="position: relative;">
              <img src="../../assets/images/saynotoplastic.webp"
                   class="img-fluid"
                   style="height: 520px; width: 100%; object-fit: fill;"
                   alt="Ad Space"
                   id="banner-image">
            </div>
          </div>


      </div>
    </div>
  </section>
